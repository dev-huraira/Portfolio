<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" fill="none">

  <!-- ── Monitor body ── -->
  <rect x="6" y="16" width="48" height="36" rx="3" fill="#111111" stroke="#2A2A2A" stroke-width="1.2"/>

  <!-- ── Screen (blue glow) ── -->
  <rect x="9" y="19" width="42" height="30" rx="2" fill="#001828"/>
  <rect x="9" y="19" width="42" height="30" rx="2" fill="url(#glow)" opacity="0.85"/>

  <!-- ── H on screen ── -->
  <rect x="18" y="24" width="3"  height="20" rx="1" fill="#00A3FF"/>
  <rect x="33" y="24" width="3"  height="20" rx="1" fill="#00A3FF"/>
  <rect x="18" y="32" width="18" height="3"  rx="1" fill="#00A3FF"/>

  <!-- ── Monitor stand ── -->
  <rect x="26" y="52" width="8" height="6" rx="1" fill="#2A2A2A"/>
  <!-- ── Monitor base ── -->
  <rect x="19" y="57" width="22" height="2.5" rx="1.2" fill="#333333"/>

  <!-- ── Desk surface ── -->
  <rect x="2" y="59" width="96" height="3.5" rx="1.5" fill="#E8E8E8" opacity="0.85"/>

  <!-- ── Chair back ── -->
  <rect x="88" y="28" width="4" height="30" rx="2" fill="#3A3A3A"/>
  <!-- ── Chair seat ── -->
  <rect x="72" y="54" width="18" height="3" rx="1.5" fill="#3A3A3A"/>

  <!-- ── Developer head ── -->
  <circle cx="75" cy="27" r="7" fill="#E8E8E8"/>

  <!-- ── Developer body / torso ── -->
  <rect x="68" y="34" width="16" height="18" rx="4" fill="#CCCCCC"/>

  <!-- ── Arm reaching to desk ── -->
  <path d="M68 44 Q60 48 52 50" stroke="#DDDDDD" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ── Legs ── -->
  <rect x="70" y="52" width="5" height="10" rx="2" fill="#BBBBBB"/>
  <rect x="79" y="52" width="5" height="10" rx="2" fill="#BBBBBB"/>

  <!-- ── Screen ambient glow ── -->
  <ellipse cx="30" cy="34" rx="16" ry="10" fill="#00A3FF" opacity="0.05"/>

  <defs>
    <linearGradient id="glow" x1="9" y1="19" x2="51" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#002640"/>
      <stop offset="100%" stop-color="#001020"/>
    </linearGradient>
  </defs>

</svg>
